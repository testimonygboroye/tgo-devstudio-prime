name: CI

on:
  push:
    branches: [main, phase-1/core-platform-foundation, phase-2/founder-control-centre, phase-3/business-ecosystem-administration]
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0-jammy
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/tgo_ci
      JWT_ACCESS_SECRET: ci-only-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-production
      JWT_TEMP_2FA_SECRET: ci-only-2fa-secret-not-for-production
      SETUP_SECRET_KEY: ci-only-setup-secret-not-for-production
      SITE_URL: https://example.invalid
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Lint new platform foundation
        run: >-
          npx eslint
          src/app/api/platform/health/route.ts
          src/app/api/platform/notifications/route.ts
          src/app/api/platform/search/route.ts
          src/app/api/platform/roles/route.ts
          'src/app/admin/(shell)/platform/page.tsx'
          'src/app/admin/(shell)/business-roles/page.tsx'
          src/lib/platform
          src/models/BusinessRole.ts
          src/models/BusinessMembership.ts
          src/models/PlatformAuditEvent.ts
          src/models/PlatformEvent.ts
          src/models/PlatformNotification.ts
          src/models/BusinessOrganization.ts
          src/app/api/platform/organizations/route.ts
          'src/app/admin/(shell)/businesses/page.tsx'
          src/components/admin/platform/OrganizationManager.tsx
          src/components/admin/platform/FounderApplicationLauncher.tsx
          src/components/admin/platform/FounderUniversalSearch.tsx
          src/components/admin/platform/FounderNotificationCentre.tsx
          src/components/admin/platform/BusinessRoleManager.tsx
          src/components/admin/AdminSidebar.tsx
          src/app/global-error.tsx
          src/platform

      - name: Type check and production build
        run: npm run build
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
