      - name: Type check and production build
        run: npm run build
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

      - name: Wait for the merged production release to become live
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          BASE_URL="${{ vars.TGO_E2E_BASE_URL || 'https://tgo-devstudio-prime.vercel.app' }}"
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --fail "$BASE_URL/faq/who-is-behind-tgo-devstudio" | grep -q "Who is behind TGO DevStudio?"; then
              echo "The merged release is live at $BASE_URL."
              exit 0
            fi
            echo "Waiting for the Vercel production deployment ($attempt/60)..."
            sleep 10
          done
          echo "The merged release did not become live within ten minutes."
          exit 1

      - name: Install Playwright runner
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: npm install --no-save --package-lock=false @playwright/test

      - name: Install Chromium
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E against the explicitly selected public deployment
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: npx playwright test
        env:
          BASE_URL: ${{ inputs.base_url || vars.TGO_E2E_BASE_URL || 'https://tgo-devstudio-prime.vercel.app' }}

      - name: Upload browser test evidence
        if: always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        uses: actions/upload-artifact@v4
        with:
          name: tgo-playwright-e2e-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
