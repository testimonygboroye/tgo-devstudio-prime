          src/app/api/platform/client-enquiries/route.ts
          'src/app/admin/(shell)/clients/page.tsx'
          'src/app/admin/(shell)/client-enquiries/page.tsx'
          src/components/admin/platform/ClientManagement.tsx
          src/components/admin/platform/ClientEnquiryManager.tsx
          src/components/public/SiteFooter.tsx
