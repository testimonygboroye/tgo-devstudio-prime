name: TGO Platform Automation

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: tgo-platform-automation
  cancel-in-progress: false

jobs:
  run-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Obtain short-lived GitHub Actions identity token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=tgo-platform-automation")
          token=$(printf '%s' "$response" | jq -r '.value // empty')
          if [[ -z "$token" ]]; then
            echo "::error::GitHub did not issue the platform automation identity token."
            exit 1
          fi
          echo "::add-mask::$token"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            payload=$(printf '%s' "$token" | cut -d. -f2 | tr '_-' '/+' | base64 -d)
            echo "OIDC identity claims (non-secret, one-time push diagnostic):"
            printf '%s' "$payload" | jq '{iss, aud, repository, repository_owner, ref, workflow_ref, sub, job_workflow_ref, exp, iat, nbf}'
          fi
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Run protected platform jobs
        shell: bash
        env:
          PLATFORM_AUTOMATION_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          base="https://tgo-devstudio-prime.onrender.com"
          failed=0
          endpoints=(
            "/api/cron/webhook-delivery"
            "/api/cron/sales-followups"
            "/api/cron/executive-reports"
            "/api/cron/marketing-campaigns"
            "/api/cron/support-escalation"
            "/api/cron/engagement-expiry"
            "/api/cron/analytics-snapshot"
            "/api/cron/ai-workforce"
          )
          for endpoint in "${endpoints[@]}"; do
            echo "::group::${endpoint}"
            if curl --fail-with-body --silent --show-error --max-time 60 \
              --header "Authorization: Bearer ${PLATFORM_AUTOMATION_TOKEN}" \
              --header "User-Agent: TGO-GitHub-Automation/1.0" \
              "${base}${endpoint}"; then
              echo
              echo "Completed: ${endpoint}"
            else
              echo
              echo "::error::Automation endpoint failed: ${endpoint}"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
